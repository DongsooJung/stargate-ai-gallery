<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stargate AI Hub · 전체 링크</title>
<meta name="description" content="Stargate AI로 생성된 HTML·대시보드·카드뉴스 전체 링크 허브">

<style>
:root{--bg:#0b0e13;--fg:#e7e9ee;--mute:#8a93a6;--card:#151a24;--border:#1f2633;--acc:#6b8cff;--acc2:#a7b8ff;--new:#67e8f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,'Segoe UI','Malgun Gothic',system-ui,sans-serif;line-height:1.45}header{padding:32px 24px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,14,19,.94);backdrop-filter:blur(8px);z-index:10}header h1{margin:0;font-size:22px;letter-spacing:-.02em}header h1 a{color:var(--acc2);text-decoration:none}.home{font-size:14px;color:#ffd29a!important;margin-left:6px;border:1px solid #3a3020;padding:4px 10px;border-radius:14px}.url{font-size:12px;color:var(--acc2);margin-left:10px;font-weight:400;font-family:ui-monospace,monospace}.sub{color:var(--mute);font-size:13px;margin-top:6px}nav{padding:12px 24px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;font-size:13px}nav button{color:var(--acc2);background:transparent;padding:5px 11px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-family:inherit}nav button.active,nav button:hover{background:var(--card);border-color:var(--acc)}main{padding:24px;max-width:1400px;margin:0 auto}.featured{margin-bottom:32px;padding:18px;border:1px solid #27506d;border-radius:16px;background:linear-gradient(135deg,rgba(21,42,68,.9),rgba(17,26,46,.9))}.featured h2{margin:0 0 12px;font-size:17px;color:var(--new)}section.cat{margin-bottom:36px}section.cat h2{font-size:17px;margin:0 0 14px}.n{display:inline-block;min-width:24px;padding:2px 8px;border-radius:12px;background:var(--card);color:var(--mute);font-size:12px;margin-left:6px;font-weight:500}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:var(--acc)}.card img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;background:#08111f;display:block}.meta{padding:10px 12px}.t{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.d{font-size:11px;color:var(--mute);margin-top:4px}.new{position:absolute;right:9px;top:9px;background:var(--new);color:#062033;font-size:10px;font-weight:800;padding:4px 7px;border-radius:8px}#empty{display:none;color:var(--mute);padding:40px;text-align:center}footer{padding:24px;color:var(--mute);font-size:12px;text-align:center;border-top:1px solid var(--border)}footer a{color:var(--acc2)}@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.url{display:none}}
</style>
</head>
<body>
<header><h1>Stargate AI Hub <a href="https://www.stargateedu.co.kr" class="home">⌂ 포털 홈</a> <span class="url">🌐 dongsoojung.github.io/stargate-ai-gallery/hub.html</span> <a href="./">· 검색 모드</a></h1><div class="sub">AI 생성 디지털 자산 전체 링크 · <b id="total">불러오는 중</b> · 업데이트 2026-07-22</div></header>
<nav id="filters"><button class="active" data-cat="">전체</button></nav>
<main>
<section class="featured"><h2>NEW · 최신 대시보드</h2><div class="grid"><a class="card" href="files/dash-003.html" target="_blank" rel="noopener"><span class="new">NEW</span><img src="files/thumbs/dash-003.svg" alt="2026년 6월 AI 활용 패턴 대시보드"><div class="meta"><div class="t">DONGSOOJUNG · 2026년 6월 AI 활용 패턴</div><div class="d">AI-전략대시보드 · 2026-07-22 · 공개 안전 집계본</div></div></a></div></section>
<div id="content"></div><div id="empty">조건에 맞는 항목이 없습니다.</div>
</main>
<footer><a href="./">인터랙티브 갤러리</a> · <a href="https://github.com/DongsooJung/stargate-ai-gallery">GitHub 저장소</a> · Stargate Corporation © 2026</footer>
<script>
const EXTRA={id:'dash-003',html:'dash-003.html',thumb:'thumbs/dash-003.svg',title:'DONGSOOJUNG · 2026년 6월 AI 활용 패턴',name:'DONGSOOJUNG_2026_06_AI_usage_dashboard.html',cat:'AI-전략대시보드',mt:'2026-07-22'};
fetch('data.json').then(r=>r.json()).then(data=>{const all=[EXTRA,...data];document.getElementById('total').textContent=`총 ${all.length}건 · 카테고리 ${new Set(all.map(x=>x.cat)).size}개`;const cats=[...new Set(all.map(x=>x.cat))].sort((a,b)=>a.localeCompare(b,'ko'));const filters=document.getElementById('filters');cats.forEach(cat=>{const b=document.createElement('button');b.dataset.cat=cat;b.textContent=`${cat} (${all.filter(x=>x.cat===cat).length})`;filters.appendChild(b)});filters.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;filters.querySelectorAll('button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.cat)});function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(active=''){const list=active?all.filter(x=>x.cat===active):all;const groups=[...new Set(list.map(x=>x.cat))].sort((a,b)=>a.localeCompare(b,'ko'));document.getElementById('content').innerHTML=groups.map(cat=>{const items=list.filter(x=>x.cat===cat).sort((a,b)=>(b.mt||'').localeCompare(a.mt||''));return `<section class="cat"><h2>${esc(cat)} <span class="n">${items.length}</span></h2><div class="grid">${items.map(x=>`<a class="card" target="_blank" rel="noopener" href="files/${esc(x.html)}">${x.id==='dash-003'?'<span class="new">NEW</span>':''}<img loading="lazy" src="files/${esc(x.thumb)}" alt=""><div class="meta"><div class="t">${esc(x.title||x.name)}</div><div class="d">${esc(x.mt||'')}</div></div></a>`).join('')}</div></section>`}).join('');document.getElementById('empty').style.display=list.length?'none':'block'}render()}).catch(()=>{document.getElementById('total').textContent='데이터 로드 오류';document.getElementById('empty').style.display='block'});
</script>
</body>
</html>
